apiVersion: v1
kind: Namespace
metadata:
  name: astronomy
  labels:
    app.kubernetes.io/part-of: manderia
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manderia-users
  namespace: astronomy
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manderia
  namespace: astronomy
  labels:
    app.kubernetes.io/name: manderia
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: manderia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manderia
      annotations:
        manderia.app/source-revision: "SOURCE_REVISION"
        manderia.app/auth-config: "AUTH_CONFIG_SHA"
    spec:
      nodeSelector:
        kubernetes.io/hostname: ravand-worker-01
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: manderia-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: users
          persistentVolumeClaim:
            claimName: manderia-users
      containers:
        - name: web
          image: IMAGE_REF
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3847
          volumeMounts:
            - name: users
              mountPath: /data
          envFrom:
            - secretRef:
                name: manderia-auth
          env:
            - name: AUTH_DB_PATH
              value: /data/users.sqlite
            - name: PORT
              value: "3847"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: manderia
  namespace: astronomy
  labels:
    app.kubernetes.io/name: manderia
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: manderia
  ports:
    - name: http
      port: 80
      targetPort: http
