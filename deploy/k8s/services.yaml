apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-time
  namespace: sufi-astronomy
spec:
  replicas: 2
  selector:
    matchLabels: { app: astro-time }
  template:
    metadata:
      labels: { app: astro-time }
    spec:
      containers:
        - name: astro-time
          image: sufi-astronomy/astro-time:latest
          ports: [{ containerPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata:
  name: astro-time
  namespace: sufi-astronomy
spec:
  selector: { app: astro-time }
  ports: [{ port: 8081, targetPort: 8081 }]
---
