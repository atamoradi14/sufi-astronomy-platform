plugins { id 'com.android.application' }
android {
    namespace 'online.fanous.satellite'
    compileSdk 35
    defaultConfig { applicationId 'online.fanous.satellite'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1.0' }
    signingConfigs { release {
        storeFile file(System.getenv('FANOUS_SIGNING_STORE') ?: '../../.local/android-signing/fanous-satellite.jks')
        storePassword System.getenv('FANOUS_SIGNING_PASSWORD')
        keyAlias 'fanous-satellite'
        keyPassword System.getenv('FANOUS_SIGNING_PASSWORD')
    } }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.squareup.okhttp3:okhttp:4.12.0' }
